[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-context"
version = "0.1.0"
description = "A pragmatic context language for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "tiktoken>=0.7"]

[project.scripts]
loom = "loom.cli:main"

[tool.setuptools]
packages = ["loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
